<div class="card mt-4">
    <div class="card-header bg-light">
        <b>Gestión de archivos de configuración</b>
    </div>
    <div class="card-body">
        <form method="post" id="form-gestor">
            <div class="row align-items-end">
                <div class="col-md-4 mb-3">
                    <label for="nombre_guardar" class="form-label">Nombre para guardar (sin .json):</label>
                    <input type="text" class="form-control" name="nombre_guardar" id="nombre_guardar" placeholder="Ej: mi_configuracion">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="archivo_config" class="form-label">Selecciona un archivo:</label>
                    <select class="form-select" name="archivo_config" id="archivo_config">
                        {% for archivo in archivos_config %}
                        <option value="{{ archivo }}">{{ archivo }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-1 mb-3">
                    <button type="submit" name="accion" value="cargar" class="btn btn-primary w-100">Cargar</button>
                </div>
                <div class="col-md-1 mb-3">
                    <button type="submit" name="accion" value="guardar_todo" class="btn-vista btn-success w-100">Guardar</button>
                </div>
                <div class="col-md-2 mb-3">
                    <button type="submit" name="accion" value="eliminar" class="btn-vista btn-danger w-100" onclick="return confirm('¿Eliminar este archivo?');">Eliminar</button>
                </div>
            </div>
        </form>
    </div>
</div>
