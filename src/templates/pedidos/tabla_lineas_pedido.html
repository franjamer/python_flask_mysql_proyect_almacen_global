{% if lineas %}
<div class="border p-1 mb-1 bg-light rounded-3 max-vh-100 max-vw-100">
    <h4 class="text-center text-uppercase" style="color: #000000;">Detalle del Pedido</h4>
    <table class="table table-dark table-sm table-bordered table-striped">
        <thead>
            <tr>
                <th style="width: 25%;">Referencia repuesto</th>
                <th style="width: 15%;">Pedida</th>
                <th style="width: 15%;">Recibida</th>
                <th style="width: 25%;">Fecha recibido</th>
                <th style="width: 10%;">Completo</th>
                <th style="width: 10%;">Eliminar</th>
            </tr>
        </thead>
        <tbody>
            {% for linea in lineas %}
            <tr>
                <td>
                    <input type="text" name="referencia_articulo[]" value="{{ linea[2] }}" class="form-control" readonly>
                </td>
                <td>
                    <input type="number" name="cantidad_pedida[]" value="{{ linea[3] }}" min="1" class="form-control form-control-sm" required>
                </td>
                <td>
                    <input type="number" name="cantidad_recibida[]" value="{{ linea[4] }}" min="0" class="form-control form-control-sm">
                </td>
                <td>
                    <input type="date" name="fecha_recibido[]" value="{{ linea[5]|default('', true) }}" class="form-control form-control-sm">
                </td>
                <td>
                    {{ 'Sí' if linea[6] else 'No' }}
                </td>
                <td>
                    {% if lineas|length > 1 %}
                    <form method="post" action="{{ url_for('pedidos_bp.eliminar_linea', linea_id=linea[0], pedido_id=pedido_id) }}" style="display:inline;" onsubmit="return confirm('¿Seguro que deseas eliminar esta línea?');">
                        <button type="submit" class="btn-vista btn-danger btn-sm">Eliminar</button>
                    </form>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endif %}
