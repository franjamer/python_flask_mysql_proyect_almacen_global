<div class="border p-1 mb-1 bg-light rounded-3 max-vh-100 max-vw-100">
    <h4 class="text-center text-uppercase" style="color: #000000;">Pedidos Globales</h4>
    {% if not pedidos %}
        <p class="text-center btn-warning">No hay pedidos disponibles.</p>
    {% endif %}
    <table class="table table-dark table-sm table-bordered table-striped table-wrap align-middle text-center">
        <thead>
            <tr>
                {% for campo in columnas %}
                    <th>{{ nombres_columnas[campo] }}</th>
                {% endfor %}
                <th>Ver</th>
                <th>Modificar</th>
                <th>Eliminar</th>
            </tr>
        </thead>
        <tbody class="table-group-divider">
            {% for pedido in pedidos %}
            <tr>
                {% for campo in columnas %}
                    <td>{{ pedido[campo] }}</td>
                {% endfor %}
                <td>
                    <a href="{{ url_for('pedidos_bp.pedidos', pedido_id=pedido['id']) }}" class="btn-vista btn-info btn-sm">Ver</a>
                </td>
                <td>
                    <a href="{{ url_for('pedidos_bp.modificar_pedido', pedido_id=pedido['id']) }}"
                    class="btn-vista btn-warning btn-sm"
                    {% if not puede_crud_pedidos(session.get('rol')) %}disabled style="opacity:0.25;pointer-events:none;"{% endif %}>
                    Modificar
                    </a>
                </td>
                <td>
                    <form method="post" action="{{ url_for('pedidos_bp.eliminar_pedido', pedido_id=pedido['id']) }}" style="display:inline;" onsubmit="return confirm('¿Seguro que deseas eliminar este pedido?');">
                        <button type="submit" class="btn-vista btn-danger btn-sm"
                            {% if not puede_eliminar_pedidos(session.get('rol')) %}disabled style="opacity:0.25;pointer-events:none;"{% endif %}>
                                Eliminar
                        </button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
