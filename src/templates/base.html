<!-- plantilla base html que contiene todos los demas parciales. -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>{% block title %}Mi App{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
        <!-- En base.html, dentro del <head> -->
        {% if config.estilo_menu %}
        <style>
        :root {
            --color-texto-menu: {{ config.estilo_menu.color_texto_menu or '#000000' }};
            --color-fondo-menu: {{ config.estilo_menu.color_fondo_menu or '#ffffff' }};
            --tamano-texto-menu: {{ config.estilo_menu.tamano_texto_menu or '16' }}px;
            --estilo-texto-menu: {{ config.estilo_menu.estilo_texto_menu or 'normal' }};
        }
        </style>
        {% endif %}
    </head>
    <body>
        <!-- En tu base.html, dentro del body, por ejemplo arriba del bloque content -->
        {% if session.get('perfil') %}
        <nav class="navbar navbar-light bg-light justify-content-between">
            <span class="navbar-text ms-3">
                Perfil:
                <strong>{{ session['perfil'] }}</strong>
            </span>
            <a href="{{ url_for('logout') }}" class="btn btn-outline-danger me-3">Cerrar sesión</a>
        </nav>
        {% endif %}
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </body>
</html>
