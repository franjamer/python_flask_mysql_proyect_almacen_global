<!-- plantilla base html que contiene todos los demas parciales. -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>{% block title %}Mi App{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <!-- En base.html, dentro del <head> -->
        {% if config.estilo_menu %}
        <style>
        :root {
            --color-texto: {{ color_texto }};
            --color-fondo: {{ color_fondo }};
            --tamano-texto: {{ tamano_texto }}px;
            --estilo-texto: {{ estilo_texto }};
        }
        </style>
        {% endif %}
    </head>
    <body>
        <!-- En tu base.html, dentro del body, por ejemplo arriba del bloque content -->
        {% if session.get('perfil') %}
        <nav class="navbar navbar-light bg-light justify-content-between">
            <span class="navbar-text ms-3">
                Perfil:
                <strong>{{ session['perfil'] }}</strong>
            </span>
            <a href="{{ url_for('logout') }}" class=" btn-outline-danger me-3">Cerrar sesión</a>
        </nav>
        {% endif %}
        <div class="container">
            {% block content %}{% endblock %}
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
