<h4>Estilos Globales</h4>
<form method="post" action="?pestana=estilos&subpestana=global">
    <input type="hidden" name="pestana" value="estilos">
    <input type="hidden" name="subpestana" value="global">
    <div class="mb-3">
        <label for="parametro_global" class="form-label">Parámetro a modificar</label>
        <select class="form-select" id="parametro_global" name="parametro_global">
            <option value="todos">Todos</option>
            <option value="color_texto_menu">Color de texto</option>
            <option value="color_fondo_menu">Color de fondo</option>
            <option value="tamano_texto_menu">Tamaño de texto</option>
            <option value="estilo_texto_menu">Estilo de texto</option>
        </select>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="global_color_texto_menu" class="form-label">Color de texto</label>
            <input type="color" class="form-control form-control-color" id="global_color_texto_menu" name="global_color_texto_menu" value="{{ color_texto }}">
        </div>
        <div class="col-md-6 mb-3">
            <label for="global_color_fondo_menu" class="form-label">Color de fondo</label>
            <input type="color" class="form-control form-control-color" id="global_color_fondo_menu" name="global_color_fondo_menu" value="{{ color_fondo }}">
        </div>
        <div class="col-md-6 mb-3">
            <label for="global_tamano_texto_menu" class="form-label">Tamaño de texto</label>
            <input type="number" class="form-control" id="global_tamano_texto_menu" name="global_tamano_texto_menu" value="{{ tamano_texto }}">
        </div>
        <div class="col-md-6 mb-3">
            <label for="global_estilo_texto_menu" class="form-label">Estilo de texto</label>
            <select class="form-select" id="global_estilo_texto_menu" name="global_estilo_texto_menu">
                <option value="normal" {% if estilo_texto == 'normal' %}selected{% endif %}>Normal</option>
                <option value="negrita" {% if estilo_texto == 'negrita' %}selected{% endif %}>Negrita</option>
                <option value="cursiva" {% if estilo_texto == 'cursiva' %}selected{% endif %}>Cursiva</option>
            </select>
        </div>
    </div>
    <button type="submit" class="btn btn-primary w-100">Aplicar Cambios</button>
</form>
