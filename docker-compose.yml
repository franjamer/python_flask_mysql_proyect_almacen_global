version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: almacen
      MYSQL_USER: usuario
      MYSQL_PASSWORD: clave
      MYSQL_ROOT_PASSWORD: rootclave
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: usuario
      DB_PASSWORD: clave
      DB_NAME: almacen
    ports:
      - "4000:4000"
    volumes:
      - ./src:/app

volumes:
  db_data: